services:
  php:
    platform: linux/x86_64
    build:
      context: ./
      dockerfile: etc/Dockerfile.dev
    depends_on:
      - redis
    ports:
      - "8081:80"
    develop:
      watch:
        - path: ./
          target: /var/www
          action: sync # sync, sync + restart, rebuild

  redis:
    platform: linux/x86_64
    image: redis
    ports:
      - "6379:6379"
